<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JP Reader – VN</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header>
    <h1>JP Reader</h1>
    <p class="subtitle">Analizador de texto japones con reglas personalizables</p>
  </header>

  <section class="input-section">
    <textarea
      id="japaneseInput"
      placeholder="Pega aqui la frase en japones"
      rows="4"
    ></textarea>

    <div class="button-row">
      <button id="analyzeBtn" class="btn-primary">Analizar</button>
      <button id="clearBtn" class="btn-secondary">Borrar</button>
      <button id="openRulesEditor" class="btn-rules">Editar Reglas</button>
    </div>
  </section>

  <div id="readingArea"></div>

  <hr />

  <h2>Guardados</h2>
  <ul id="savedUnits"></ul>

  <script src="kuromoji.js"></script>
  <script src="storage.js"></script>
  <script src="rules-engine.js"></script>
  <script src="rules-editor.js"></script>
  <script src="app.js"></script>

</body>
</html>
